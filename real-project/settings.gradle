public static String getActualCwd() {
    try {
        String os = System.getProperty("os.name").toLowerCase();
        Process process;

        if (os.contains("win")) {
            process = Runtime.getRuntime().exec("cmd /c cd");
        } else {
            process = Runtime.getRuntime().exec("pwd");
        }

        BufferedReader reader = new BufferedReader(
                new InputStreamReader(process.getInputStream())
        );
        String cwd = reader.readLine();
        process.waitFor();
        return cwd;
    } catch (Exception e) {
        e.printStackTrace();
        return null;
    }
}

String pwdFromProcess = file(getActualCwd()).name

String pwd = System.getenv("PWD")
Path cwd = Paths.get(pwd ?: "")
Path realCwd = cwd.toRealPath(LinkOption.NOFOLLOW_LINKS)

